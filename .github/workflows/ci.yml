name: CI

# Pull requests are the only gate: branch protection keeps every PR current
# with main, so a merge lands a tree CI has already seen. Releases run from
# the Release workflow on the main push itself.
on:
  pull_request:

env:
  MIX_ENV: test

jobs:
  checks:
    name: Checks (mix ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - name: Compile, format, lint, audit & architecture
        run: mix ci

      - name: Install Helm 3.21.3
        run: |
          set -euo pipefail
          version=3.21.3
          archive=/tmp/helm.tar.gz
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://get.helm.sh/helm-v${version}-linux-amd64.tar.gz"
          echo "15e041a93a590dce8100f39385cd98c84a765c9e36aeeb9e2dc6ff9e4769e2e0  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/linux-amd64/helm "$HOME/.local/bin/helm"
          helm version --short

      - name: Provision chart assertion dependencies
        run: |
          python3 -m venv /tmp/smolquery-chart-venv
          /tmp/smolquery-chart-venv/bin/pip install --quiet PyYAML==6.0.2
          echo "/tmp/smolquery-chart-venv/bin" >> "$GITHUB_PATH"

      - name: Lint and validate Helm chart
        run: scripts/chart-test

      - name: Install kind 0.32.0
        run: |
          set -euo pipefail
          binary=/tmp/kind
          curl --fail --location --silent --show-error \
            --output "$binary" \
            "https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  $binary" | sha256sum --check --status
          install -m 0755 "$binary" "$HOME/.local/bin/kind"
          kind version

      - name: Validate live Helm topology guards
        run: |
          set -euo pipefail
          kind create cluster --name smolquery-chart --wait 180s
          trap 'kind delete cluster --name smolquery-chart' EXIT
          scripts/chart-topology-test

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        # bitnami's image (unlike minio/minio) runs `server` off env vars alone —
        # GitHub Actions service containers cannot override a command/args.
        # bitnamilegacy, not bitnami: Broadcom moved bitnami/minio's free
        # tags off Docker Hub in 2025 ("manifest unknown" on :latest);
        # bitnamilegacy is the frozen free mirror.
        image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
        env:
          MINIO_ROOT_USER: smolquery
          MINIO_ROOT_PASSWORD: smolquery-secret
          MINIO_DEFAULT_BUCKETS: smolquery-store-s3-test
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Cache DuckDB extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.duckdb
          key: duckdb-${{ runner.os }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - name: Start epmd for the two-node gen_rpc tests
        run: epmd -daemon
      - run: mix test --only integration

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Cache PLTs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-otp29.0.2-elixir1.20.2-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-otp29.0.2-elixir1.20.2-

      - run: mix deps.get
      - run: mix dialyzer
