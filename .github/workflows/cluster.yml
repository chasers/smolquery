name: Cluster

# The :cluster suite runs against real kind hosts because :peer cannot reproduce
# distinct pod DNS names and shared service ports. It runs for every pull
# request, so the merge gate already saw it; the release gate on main pushes
# is the CI workflow (see release.yml).
on:
  workflow_dispatch:
  pull_request:

env:
  MIX_ENV: test

jobs:
  cluster:
    name: Cluster tests (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get

      # Runners ship docker and kubectl but not kind, and scripts/kind-up.sh
      # creates the cluster from deploy/overlays/kind/kind-config.yaml itself —
      # so install the binary rather than using an action that would create its
      # own cluster.
      - name: Install kind
        run: |
          curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          sudo install -m 0755 ./kind /usr/local/bin/kind
          kind version

      - name: Bring up the cluster
        run: ./scripts/kind-up.sh

      - name: Cluster tests
        run: mix test --only cluster

      - name: Fleet state on failure
        if: failure()
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/config
        run: |
          kubectl --context kind-smolquery -n smolquery get pods -o wide
          kubectl --context kind-smolquery -n smolquery describe pods
          kubectl --context kind-smolquery -n smolquery logs -l app=smolquery-buffer \
            --tail=200 --prefix --all-containers
