# Builds a branch's release image and its Lambda runner image for the burst
# spike (T-673, PL-77). Runs on every push to the spike branch (a workflow
# is only dispatchable by name once it is on main). Each platform builds on
# its own native runner and publishes its own tag:
#   ghcr.io/smolquery/smolquery:spike-<sha>-amd64   (the parent pod, EKS x86 nodes)
#   ghcr.io/smolquery/smolquery:spike-<sha>-arm64   (the Lambda base)
#   ghcr.io/smolquery/smolquery-lambda:spike-<sha>  (the Lambda runner, arm64)
name: Spike image

on:
  workflow_dispatch:
  push:
    branches: [t673-lambda-spike]

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/smolquery/smolquery
  GHCR_LAMBDA_IMAGE: ghcr.io/smolquery/smolquery-lambda

jobs:
  release:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ env.GHCR_IMAGE }}:spike-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=spike-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=spike-${{ matrix.arch }}

  lambda:
    needs: release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the Lambda runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lambda
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            BASE=${{ env.GHCR_IMAGE }}:spike-${{ github.sha }}-arm64
          tags: ${{ env.GHCR_LAMBDA_IMAGE }}:spike-${{ github.sha }}
