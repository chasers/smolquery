# Builds a branch's release image and its Lambda runner image for the burst
# spike (T-673, PL-77). Runs on every push to the spike branch (a workflow
# is only dispatchable by name once it is on main); publishes
# ghcr.io/smolquery/smolquery:spike-<sha> and
# ghcr.io/smolquery/smolquery-lambda:spike-<sha>, both linux/arm64 only,
# which is what the Lambda function runs.
name: Spike image

on:
  workflow_dispatch:
  push:
    branches: [t673-lambda-spike]

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/smolquery/smolquery
  GHCR_LAMBDA_IMAGE: ghcr.io/smolquery/smolquery-lambda

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ env.GHCR_IMAGE }}:spike-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish the Lambda runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lambda
          platforms: linux/arm64
          push: true
          build-args: |
            BASE=${{ env.GHCR_IMAGE }}:spike-${{ github.sha }}
          tags: ${{ env.GHCR_LAMBDA_IMAGE }}:spike-${{ github.sha }}
