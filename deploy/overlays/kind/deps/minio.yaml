apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: smolquery
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: smolquery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        # bitnamilegacy, not minio/minio: Docker Hub stopped serving minio/minio
        # and minio/mc to anonymous pulls on 2026-09-11 (401 on every digest and
        # tag), and bitnamilegacy is the frozen free mirror ci.yml's integration
        # job already pins (T-466). This image runs `server` off environment
        # variables and creates MINIO_DEFAULT_BUCKETS itself, which is what
        # Store.S3 needs (segment PUTs do not create their bucket), so the mc
        # job that used to do that is gone with the mc image. MINIO_DATA_DIR keeps
        # the objects at /data, where the cluster tests look for them.
        - name: minio
          image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
          env:
            - name: MINIO_ROOT_USER
              value: smolquery
            - name: MINIO_ROOT_PASSWORD
              value: smolquery-secret
            - name: MINIO_DEFAULT_BUCKETS
              value: smolquery-sealed
            - name: MINIO_DATA_DIR
              value: /data
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
