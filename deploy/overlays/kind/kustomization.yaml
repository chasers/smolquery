apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - deps
  - external-service.yaml

images:
  - name: smolquery
    newTag: dev

secretGenerator:
  - name: smolquery-env
    namespace: smolquery
    literals:
      - CATALOG_DATABASE_URL=postgres://postgres:postgres@postgres/smolquery
      - SMOLQUERY_AUTH_MODE=static
      - SMOLQUERY_API_KEY=kind-only-api-key
      - SMOLQUERY_INTERNAL_SECRET=kind-only-internal-secret
      - SMOLQUERY_WEB_IP=0.0.0.0
      - SMOLQUERY_WEB_USERNAME=smolquery
      - SMOLQUERY_WEB_PASSWORD=kind-only-web-password
      - SMOLQUERY_WEB_CHECK_ORIGIN=false
      - SMOLQUERY_SECRET_KEY_BASE=kind-only-secret-key-base-never-use-this-outside-a-local-kind-cluster
      - RELEASE_COOKIE=kind-only-cookie
      - SMOLQUERY_S3_BUCKET=smolquery-sealed
      - SMOLQUERY_S3_ACCESS_KEY_ID=smolquery
      - SMOLQUERY_S3_SECRET_ACCESS_KEY=smolquery-secret
      - SMOLQUERY_S3_ENDPOINT=http://minio:9000
      # Plaintext by default: TLS on gen_rpc costs ~26% of ingest
      # throughput, and a dev overlay that every consumer immediately
      # turns off is the wrong default. Flip these to exercise the TLS
      # path; the certificates below stay mounted either way.
      - GEN_RPC_TLS=false
      - DIST_TLS=false

  - name: smolquery-gen-rpc-tls
    namespace: smolquery
    files:
      - tls/ca.pem
      - tls/smolquery-api-0.pem
      - tls/smolquery-api-0.key
      - tls/smolquery-buffer-0.pem
      - tls/smolquery-buffer-0.key
      - tls/smolquery-buffer-1.pem
      - tls/smolquery-buffer-1.key
      - tls/smolquery-buffer-2.pem
      - tls/smolquery-buffer-2.key
      - tls/smolquery-storage-0.pem
      - tls/smolquery-storage-0.key
      - tls/smolquery-storage-1.pem
      - tls/smolquery-storage-1.key

generatorOptions:
  disableNameSuffixHash: true
