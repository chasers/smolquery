# The symmetric kind topology: base/core plus a fleet of three identical
# all-role servers, instead of base's disaggregated api/buffer/storage split.
# Select it with SMOLQUERY_KIND_OVERLAY=kind-symmetric ./scripts/kind-up.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/core
  - ../kind/deps
  - server.yaml
  - external-service.yaml

# The front-door Service comes from base/core pointing at the api pod; here
# every server answers it.
patches:
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: smolquery-api
        namespace: smolquery
      spec:
        selector:
          app: smolquery-server
    target:
      kind: Service
      name: smolquery-api

images:
  - name: smolquery
    newTag: dev

secretGenerator:
  - name: smolquery-env
    namespace: smolquery
    literals:
      - CATALOG_DATABASE_URL=postgres://postgres:postgres@postgres/smolquery
      - SMOLQUERY_API_KEY=kind-only-api-key
      - SMOLQUERY_INTERNAL_SECRET=kind-only-internal-secret
      - SMOLQUERY_WEB_IP=0.0.0.0
      - RELEASE_COOKIE=kind-only-cookie
      - SMOLQUERY_S3_BUCKET=smolquery-sealed
      - SMOLQUERY_S3_ACCESS_KEY_ID=smolquery
      - SMOLQUERY_S3_SECRET_ACCESS_KEY=smolquery-secret
      - SMOLQUERY_S3_ENDPOINT=http://minio:9000
      - GEN_RPC_TLS=true
      - DIST_TLS=true

  - name: smolquery-gen-rpc-tls
    namespace: smolquery
    files:
      - tls/ca.pem
      - tls/smolquery-server-0.pem
      - tls/smolquery-server-0.key
      - tls/smolquery-server-1.pem
      - tls/smolquery-server-1.key
      - tls/smolquery-server-2.pem
      - tls/smolquery-server-2.key

generatorOptions:
  disableNameSuffixHash: true
