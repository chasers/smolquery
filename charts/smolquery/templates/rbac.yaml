{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "smolquery.serviceAccountName" . }}
  labels:
    {{- include "smolquery.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ if .Values.podOperations.enabled }}true{{ else }}false{{ end }}
{{- end }}
{{- if .Values.podOperations.enabled }}
{{- if .Values.serviceAccount.create }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "smolquery.fullname" . }}-pod-ops
  labels:
    {{- include "smolquery.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "smolquery.fullname" . }}-pod-ops
  labels:
    {{- include "smolquery.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "smolquery.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "smolquery.fullname" . }}-pod-ops
  apiGroup: rbac.authorization.k8s.io
{{- end }}
