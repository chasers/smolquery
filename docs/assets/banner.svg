<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="smolquery — an open source BigQuery alternative, powered by DuckDB and Elixir">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f14"/>
      <stop offset="0.55" stop-color="#111420"/>
      <stop offset="1" stop-color="#161a2b"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="1" stop-color="#dfe4fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf5c"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="1050" cy="128" r="150" fill="#f59e0b" opacity="0.10" filter="url(#soft)"/>
  <circle cx="1168" cy="272" r="110" fill="#fbbf5c" opacity="0.07" filter="url(#soft)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="96" y="182" font-size="104" font-weight="700" letter-spacing="-4" fill="url(#ink)">smol<tspan fill="url(#accent)">query</tspan></text>
    <text x="100" y="234" font-size="24" font-weight="500" fill="#c9d1ee">An open source BigQuery alternative</text>
    <text x="100" y="278" font-size="16.5" letter-spacing="0.4" fill="#8891b4">DuckDB&#160;&#160;·&#160;&#160;Parquet + DuckLake&#160;&#160;·&#160;&#160;streaming inserts&#160;&#160;·&#160;&#160;Elixir/OTP</text>
  </g>

  <g transform="translate(986 96)">
    <g fill="#2a3149">
      <rect x="0"   y="96"  width="16" height="72"  rx="4"/>
      <rect x="30"  y="60"  width="16" height="108" rx="4"/>
      <rect x="60"  y="112" width="16" height="56"  rx="4"/>
      <rect x="90"  y="34"  width="16" height="134" rx="4"/>
      <rect x="120" y="78"  width="16" height="90"  rx="4"/>
      <rect x="150" y="120" width="16" height="48"  rx="4"/>
      <rect x="180" y="52"  width="16" height="116" rx="4"/>
    </g>
    <g fill="url(#accent)">
      <rect x="30"  y="60"  width="16" height="108" rx="4" opacity="0.9"/>
      <rect x="90"  y="34"  width="16" height="134" rx="4"/>
      <rect x="180" y="52"  width="16" height="116" rx="4" opacity="0.75"/>
    </g>
    <rect x="-8" y="180" width="212" height="3" rx="1.5" fill="#2a3149"/>
    <g fill="#4a5375">
      <rect x="0"   y="196" width="16" height="6" rx="3"/>
      <rect x="30"  y="196" width="16" height="6" rx="3"/>
      <rect x="60"  y="196" width="16" height="6" rx="3"/>
      <rect x="90"  y="196" width="16" height="6" rx="3"/>
      <rect x="120" y="196" width="16" height="6" rx="3"/>
      <rect x="150" y="196" width="16" height="6" rx="3"/>
      <rect x="180" y="196" width="16" height="6" rx="3"/>
    </g>
  </g>
</svg>
